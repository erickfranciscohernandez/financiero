name: Generar Newsletter Diario

on:
  # Ejecutar todos los días a las 7:00 AM hora de Chile (UTC-3 = 10:00 UTC)
  schedule:
    - cron: '0 10 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  generar-newsletter:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install anthropic
      
      - name: Generar newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generar_newsletter.py
      
      - name: Commit y push de cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --staged --quiet || git commit -m "Newsletter generado automáticamente - $(date +'%Y-%m-%d')"
          git push
      
      - name: Deploy a Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './output'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Newsletter del día - $(date +'%Y-%m-%d')"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1
