name: Generate Daily Newsletter

on:
  schedule:
    # Ejecutar cada 6 horas
    - cron: '0 */6 * * *'
  # También permitir ejecución manual
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests weasyprint beautifulsoup4 lxml

      - name: Generate dynamic mock news (for sandbox environment)
        run: python generate_mock_news.py

      - name: Fetch indicadores macroeconómicos (SII + BCCh + mindicador.cl)
        env:
          BCENTRAL_USER: ${{ secrets.BCENTRAL_USER }}
          BCENTRAL_PASS: ${{ secrets.BCENTRAL_PASS }}
        run: python fetch_live_data.py

      - name: Generate newsletter v4 with visualizations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python generate_newsletter_v4.py

      - name: Export to multiple formats (PDF, JSON, CSV)
        run: python export_newsletter.py

      - name: Run alert system
        run: python alerts_system.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add newsletter.html newsletter_v4.html live_indicators.json live_data_cache.json \
                  alerts_*.json noticias_diarias.json newsletter_*.pdf \
                  newsletter_data_*.json noticias_*.csv resumen_*.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update newsletter with live data - $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Enviar email con link al newsletter
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py
