name: Generate Daily Newsletter

on:
  schedule:
    # Ejecutar cada 6 horas
    - cron: '0 */6 * * *'
  # También permitir ejecución manual
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests weasyprint

      - name: Generate dynamic mock news (for sandbox environment)
        run: python generate_mock_news.py

      - name: Fetch live economic indicators (FASE 4)
        run: python fetch_live_data.py

      - name: Generate newsletter v4 with visualizations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python generate_newsletter_v4.py

      - name: Export to multiple formats (PDF, JSON, CSV)
        run: python export_newsletter.py

      - name: Run alert system
        run: python alerts_system.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add newsletter.html newsletter_v4.html live_indicators.json alerts_*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update newsletter with live data - $(date +'%Y-%m-%d')"
          git push

      - name: Enviar email con link al newsletter
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python3 << 'EOF'
          import smtplib
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from datetime import datetime

          email_from     = os.environ.get('EMAIL_FROM', '')
          email_password = os.environ.get('EMAIL_PASSWORD', '')
          email_to_raw   = os.environ.get('EMAIL_TO', '')

          if not all([email_from, email_password, email_to_raw]):
              print('⚠️  Secrets de email no configurados, omitiendo envío.')
              exit(0)

          recipients = [e.strip() for e in email_to_raw.split(',') if e.strip()]

          repo = 'erickfranciscohernandez/financiero'
          newsletter_url = f'https://{repo.split("/")[0]}.github.io/{repo.split("/")[1]}/newsletter_v4.html'
          fecha = datetime.now().strftime('%d/%m/%Y')
          hora  = datetime.now().strftime('%H:%M')

          subject = f'📰 El Despacho · Newsletter Estratégico — {fecha}'

          html_body = f"""
          <html><body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
            <div style="border-top: 4px solid #8b1a1a; padding-top: 20px;">
              <h2 style="color: #1a1a1a; font-size: 24px; margin-bottom: 4px;">El Despacho</h2>
              <p style="color: #8a8a8a; font-size: 12px; margin: 0;">Newsletter Estratégico · {fecha}</p>
            </div>
            <div style="margin: 30px 0;">
              <p style="color: #1a1a1a; font-size: 16px;">
                Tu newsletter del día está listo. Haz clic para ver el análisis completo de geopolítica, mercados, Chile y tecnología.
              </p>
              <div style="text-align: center; margin: 30px 0;">
                <a href="{newsletter_url}" style="background: #8b1a1a; color: white; padding: 14px 32px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 3px;">
                  Ver Newsletter →
                </a>
              </div>
              <p style="color: #8a8a8a; font-size: 13px;">Generado a las {hora} UTC · Actualizado automáticamente</p>
            </div>
            <div style="border-top: 1px solid #e0e0e0; padding-top: 15px; margin-top: 20px;">
              <p style="color: #aaa; font-size: 11px; text-align: center;">
                El Despacho · Newsletter Estratégico<br>
                Este boletín es de carácter informativo y no constituye asesoría de inversión.
              </p>
            </div>
          </body></html>
          """

          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From']    = email_from
          msg['To']      = ', '.join(recipients)
          msg.attach(MIMEText(html_body, 'html'))

          try:
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.login(email_from, email_password)
                  server.sendmail(email_from, recipients, msg.as_string())
              print(f'✅ Email enviado a: {", ".join(recipients)}')
          except Exception as e:
              print(f'❌ Error enviando email: {e}')
              exit(1)
          EOF
