<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario de Problemas - Soporte Técnico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --danger: #dc2626;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #0891b2;
            --light: #f3f4f6;
            --dark: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        .search-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .search-container {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            grid-column: 1 / -1;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .results {
            display: grid;
            gap: 20px;
        }

        .problem-card {
            background: white;
            border-left: 4px solid var(--primary);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .problem-card.software {
            border-left-color: #3b82f6;
        }

        .problem-card.hardware {
            border-left-color: #ef4444;
        }

        .problem-card.accesos {
            border-left-color: #f59e0b;
        }

        .problem-card.dlp {
            border-left-color: #8b5cf6;
        }

        .problem-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .problem-id {
            background: var(--light);
            color: var(--dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .problem-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .severity-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-critical {
            background: #fee2e2;
            color: #991b1b;
        }

        .severity-high {
            background: #fef3c7;
            color: #92400e;
        }

        .severity-medium {
            background: #dbeafe;
            color: #1e3a8a;
        }

        .problem-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .category-software {
            background: #dbeafe;
            color: #1e40af;
        }

        .category-hardware {
            background: #fee2e2;
            color: #991b1b;
        }

        .category-accesos {
            background: #fef3c7;
            color: #92400e;
        }

        .category-dlp {
            background: #ede9fe;
            color: #5b21b6;
        }

        .problem-description {
            color: #4b5563;
            margin: 12px 0;
            line-height: 1.6;
        }

        .section-title {
            font-weight: 700;
            color: var(--dark);
            margin: 16px 0 8px 0;
            font-size: 14px;
        }

        .symptoms-list,
        .solutions-list {
            list-style: none;
            margin-left: 0;
        }

        .symptoms-list li,
        .solutions-list li {
            padding: 8px 0 8px 24px;
            color: #4b5563;
            position: relative;
            line-height: 1.5;
        }

        .symptoms-list li:before {
            content: "⚠";
            position: absolute;
            left: 0;
            color: #f59e0b;
        }

        .solutions-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #10b981;
        }

        .no-results {
            background: white;
            padding: 60px 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .no-results h2 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .no-results p {
            color: #6b7280;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-top: 8px;
        }

        .code-block {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            color: #374151;
            margin: 8px 0;
        }

        .filter-active {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .filter-active {
                position: static;
                margin-top: 20px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Diccionario de Problemas</h1>
            <p>Consulta soluciones para problemas de Software, Hardware, Accesos y DLP</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-problems">0</div>
                <div class="stat-label">Problemas Totales</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="critical-problems">0</div>
                <div class="stat-label">Críticos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="high-problems">0</div>
                <div class="stat-label">Altos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="results-count">0</div>
                <div class="stat-label">Resultados</div>
            </div>
        </div>

        <div class="search-container">
            <div class="form-group">
                <label for="search-input">🔍 Buscar problema:</label>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Ej: contraseña, API, disco lleno..."
                >
            </div>

            <div class="form-group">
                <label for="category-filter">📂 Categoría:</label>
                <select id="category-filter">
                    <option value="">-- Todas las categorías --</option>
                    <option value="Software">Software</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Accesos">Accesos</option>
                    <option value="DLP">DLP</option>
                </select>
            </div>

            <div class="form-group">
                <label for="severity-filter">⚠️ Severidad:</label>
                <select id="severity-filter">
                    <option value="">-- Todas las severidades --</option>
                    <option value="critical">Crítica</option>
                    <option value="high">Alta</option>
                    <option value="medium">Media</option>
                </select>
            </div>

            <div class="form-group">
                <label for="problem-id-filter">ID Problema:</label>
                <input
                    type="text"
                    id="problem-id-filter"
                    placeholder="Ej: SW001, HW002..."
                >
            </div>

            <div class="buttons">
                <button class="btn btn-primary" id="search-btn">🔍 Buscar</button>
                <button class="btn btn-secondary" id="clear-btn">🔄 Limpiar filtros</button>
            </div>
        </div>

        <div id="results" class="results"></div>

        <div class="footer">
            <p>💡 Actualiza esta página periódicamente para obtener los últimos problemas y soluciones</p>
        </div>
    </div>

    <script>
        let allProblems = [];

        async function loadProblems() {
            try {
                const response = await fetch('issues_dictionary.json');
                const data = await response.json();
                allProblems = data.problems;
                updateStats();
                displayAllProblems();
            } catch (error) {
                console.error('Error loading problems:', error);
                document.getElementById('results').innerHTML =
                    '<div class="no-results"><h2>Error</h2><p>No se pudieron cargar los problemas</p></div>';
            }
        }

        function updateStats() {
            const total = allProblems.length;
            const critical = allProblems.filter(p => p.severity === 'critical').length;
            const high = allProblems.filter(p => p.severity === 'high').length;

            document.getElementById('total-problems').textContent = total;
            document.getElementById('critical-problems').textContent = critical;
            document.getElementById('high-problems').textContent = high;
        }

        function displayAllProblems() {
            displayProblems(allProblems);
        }

        function displayProblems(problems) {
            const resultsDiv = document.getElementById('results');
            document.getElementById('results-count').textContent = problems.length;

            if (problems.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="no-results">
                        <h2>No hay resultados</h2>
                        <p>No se encontraron problemas que coincidan con los filtros seleccionados.</p>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = problems.map(problem => `
                <div class="problem-card ${problem.category.toLowerCase()}">
                    <div class="problem-header">
                        <span class="problem-id">${problem.id}</span>
                        <span class="severity-badge severity-${problem.severity}">${getSeverityLabel(problem.severity)}</span>
                    </div>
                    <h2 class="problem-title">${problem.title}</h2>
                    <span class="problem-category category-${problem.category.toLowerCase()}">${problem.category}</span>

                    <p class="problem-description">${problem.description}</p>

                    <div class="section-title">⚠️ Síntomas</div>
                    <ul class="symptoms-list">
                        ${problem.symptoms.map(symptom => `<li>${symptom}</li>`).join('')}
                    </ul>

                    <div class="section-title">✓ Soluciones</div>
                    <ul class="solutions-list">
                        ${problem.solutions.map(solution => `<li>${solution}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function getSeverityLabel(severity) {
            const labels = {
                'critical': 'CRÍTICA',
                'high': 'ALTA',
                'medium': 'MEDIA'
            };
            return labels[severity] || severity;
        }

        function filterProblems() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const severity = document.getElementById('severity-filter').value;
            const problemId = document.getElementById('problem-id-filter').value.toUpperCase();

            let filtered = allProblems.filter(problem => {
                const matchesSearch =
                    problem.title.toLowerCase().includes(searchTerm) ||
                    problem.description.toLowerCase().includes(searchTerm) ||
                    problem.symptoms.some(s => s.toLowerCase().includes(searchTerm)) ||
                    problem.solutions.some(s => s.toLowerCase().includes(searchTerm));

                const matchesCategory = !category || problem.category === category;
                const matchesSeverity = !severity || problem.severity === severity;
                const matchesId = !problemId || problem.id.includes(problemId);

                return matchesSearch && matchesCategory && matchesSeverity && matchesId;
            });

            displayProblems(filtered);
        }

        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('category-filter').value = '';
            document.getElementById('severity-filter').value = '';
            document.getElementById('problem-id-filter').value = '';
            displayAllProblems();
        }

        document.getElementById('search-btn').addEventListener('click', filterProblems);
        document.getElementById('clear-btn').addEventListener('click', clearFilters);

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') filterProblems();
        });

        document.getElementById('category-filter').addEventListener('change', filterProblems);
        document.getElementById('severity-filter').addEventListener('change', filterProblems);
        document.getElementById('problem-id-filter').addEventListener('keyup', filterProblems);

        loadProblems();
    </script>
</body>
</html>
